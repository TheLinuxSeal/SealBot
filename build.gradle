plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = project.mod_version
group = project.mod_group_id
base { archivesName = project.mod_id }

repositories {
    mavenCentral()

    // 1. ADD THIS LINE: This gives Gradle access to GitHub-hosted maven projects
    maven { url = URI.create("https://jitpack.io") }

    // Your existing NeoForge / Mod repositories...
    maven { url = URI.create("https://maven.neoforged.net/releases") }
}

java {
    //toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    implementation "com.ezylang:EvalEx:3.4.0"
    jarJar(implementation("com.ezylang:EvalEx")) {
        version { strictly '[3.4.0,4)'; prefer '3.4.0' }
    }
    jarJar("de.kherud:llama:[4.1.0,5.0.0)") {
        version {
            prefer "4.1.0"
        }
    }

    // 2. Development compile view access
    implementation "de.kherud:llama:4.1.0"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}